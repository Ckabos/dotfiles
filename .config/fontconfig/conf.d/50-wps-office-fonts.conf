<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Fuentes de Office para WPS. Arregla dos huecos de ttf-wps-fonts 2.0:

  1) Candara: el archivo Candaral.ttf / Candarali.ttf de wps-fonts es la cara
     LIGHT, pero su metadata se anuncia también como "Regular", usurpando el
     peso normal y haciendo que el texto en Candara salga más delgado. Los
     rechazamos: ttf-vista-fonts ya provee Candara Regular/Bold/Italic reales.

  2) Cambria: respaldo metric-compatible. Si algún día falta la Cambria real
     (p.ej. se desinstala ttf-vista-fonts), cae en Caladea (mismas métricas)
     en vez de en la negrita. Con la Cambria real presente, esto no se usa.
-->
<fontconfig>

  <!-- (1) Descartar las caras Light de Candara de wps-fonts (metadata errónea) -->
  <selectfont>
    <rejectfont>
      <glob>/usr/share/fonts/wps-fonts/Candaral.ttf</glob>
      <glob>/usr/share/fonts/wps-fonts/Candarali.ttf</glob>
    </rejectfont>
  </selectfont>

  <!-- (2) Respaldo: Cambria -> Caladea (solo si no hay Cambria real) -->
  <alias binding="same">
    <family>Cambria</family>
    <default><family>Caladea</family></default>
  </alias>

</fontconfig>
