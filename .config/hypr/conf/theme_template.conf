# =============================================================================
# THEME TEMPLATE (.conf) — procesado por setTheme.sh (tema con nombre)
# Placeholders: ${bg} ${fg} ${primary} ${error}  (hex sin '#', de hypr_colors)
# =============================================================================

general {
    col.active_border = rgb(${primary}) rgb(${error}) rgb(${primary}) 45deg
    col.inactive_border = rgb(${bg})
}

group {
    col.border_active = rgb(${primary}) rgb(${error}) rgb(${primary}) 45deg
    col.border_inactive = rgb(${bg})
    col.border_locked_active = rgb(${primary}) rgb(${error}) rgb(${primary}) 45deg
    col.border_locked_inactive = rgb(${bg})

    groupbar {
        col.active = rgb(${primary})
        col.inactive = rgb(${bg})
        col.locked_active = rgb(${primary})
        col.locked_inactive = rgb(${bg})
        text_color = rgb(${fg})
    }
}
