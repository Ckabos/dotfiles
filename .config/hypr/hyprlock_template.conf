# ============================================================
# HYPRLOCK TEMPLATE (theme-aware)
# setTheme.sh genera hyprlock.conf desde este archivo, inyectando
# los colores ${bg}/${fg}/${error}. NO editar hyprlock.conf directo.
#
# Variante ENDURECIDA: reloj, saludo, fecha, bateria, red y bluetooth.
# Sin clima (no filtra ubicacion) ni musica (no filtra actividad).
# Privacidad: SSID y nombre de dispositivo BT ocultos en pantalla bloqueada.
# ============================================================

$scrPath      = ~/.config/hypr/hyprlock/

# Privacidad: false = muestra "Conectado" en vez del SSID / nombre BT
$wifi-mode    = false
$bt-mode      = false

# Fuentes (instaladas en el sistema)
$font-text    = JetBrainsMono Nerd Font
$font-display = JetBrainsMono Nerd Font

# Geometria
$rounding     = 12
$shape-rd     = -1
$weight       = 2

# Colores de labels/pills: fijos blanco/negro para legibilidad sobre el
# screenshot difuminado (el tema solo afecta al input-field, abajo).
$clock-color  = rgba(255, 255, 255, 1)
$fg0          = rgba(255, 255, 255, 1)
$fg1          = rgba(0, 0, 0, 1)
$shape-col0   = rgba(255, 255, 255, 1)

$shadow-pass        = 2
$shadow-size        = 3
$shadow-color       = rgb(0,0,0)
$shadow-boost       = 1.2
$text-shadow-pass   = 1
$text-shadow-boost  = 0.5

general {
    hide_cursor        = true
    ignore_empty_input = true
    text_trim          = true
}

auth {
    fingerprint {
        enabled = true
    }
}

# BACKGROUND (screenshot difuminado)
background {
    monitor           =
    path              = screenshot
    blur_passes       = 3
    blur_size         = 6
    noise             = 0.0
    contrast          = 0.8916
    brightness        = 0.7172
    vibrancy          = 0.1696
    vibrancy_darkness = 0
}

# INPUT FIELD (tematizado: ${fg}/${bg}/${error})
input-field {
    monitor           =
    size              = 275, 55
    rounding          = $rounding
    outline_thickness = $weight
    outer_color       = rgb(${fg})
    dots_size         = 0.1
    dots_spacing      = 1
    dots_center       = true
    inner_color       = rgba(${bg}55)
    font_color        = rgb(${fg})
    check_color       = rgb(${fg})
    fail_color        = rgb(${error})
    fade_on_empty     = false
    font_family       = $font-text
    placeholder_text  = <span>󰢏 Efrain</span>
    fail_text         = <i>$FAIL <b>($ATTEMPTS)</b></i>
    hide_input        = false
    position          = 0, -240
    halign            = center
    valign            = center
    zindex            = 10
}

# TIME HR
label {
    monitor      =
    text         = cmd[update:1000] echo -e "$(date +"%H")"
    color        = $clock-color
    shadow_pass  = $shadow-pass
    shadow_size  = $shadow-size
    shadow_color = $shadow-color
    shadow_boost = $shadow-boost
    font_size    = 150
    font_family  = $font-display
    position     = 0, -155
    halign       = center
    valign       = top
}

# TIME MM
label {
    monitor      =
    text         = cmd[update:1000] echo -e "$(date +"%M")"
    color        = $clock-color
    shadow_pass  = $shadow-pass
    shadow_size  = $shadow-size
    shadow_color = $shadow-color
    shadow_boost = $shadow-boost
    font_size    = 150
    font_family  = $font-display
    position     = 0, -325
    halign       = center
    valign       = top
}

# GREETING
label {
    monitor       =
    text          = cmd[update:1000] echo "$(bash $scrPath/greeting.sh)"
    shadow_passes = $text-shadow-pass
    shadow_boost  = $text-shadow-boost
    color         = $fg0
    font_size     = 11
    font_family   = $font-text
    position      = 0, -55
    halign        = center
    valign        = center
}

# TODAY IS
label {
    monitor       =
    text          = cmd[update:1000] bash -c 'echo "Hoy es $(date +%A)"'
    shadow_passes = $text-shadow-pass
    shadow_boost  = $text-shadow-boost
    color         = $fg0
    font_size     = 11
    font_family   = $font-text
    position      = 0, -75
    halign        = center
    valign        = center
}

# DATE
label {
    monitor       =
    text          = cmd[update:1000] bash -c 'echo "$(date +%-d) de $(date +%B) de $(date +%Y)"'
    shadow_passes = $text-shadow-pass
    shadow_boost  = $text-shadow-boost
    color         = $fg0
    font_size     = 14
    font_family   = $font-text
    position      = 0, -115
    halign        = center
    valign        = center
}

# BATTERY
label {
    monitor     =
    text        = cmd[update:1000] echo -e "$($scrPath/battery.sh)"
    color       = $fg1
    font_size   = 12
    font_family = $font-text
    position    = -37, 29
    halign      = right
    valign      = bottom
    zindex      = 5
}

# NETWORK
label {
    monitor     =
    text        = cmd[update:1000] echo -e "$($scrPath/network.sh)"
    color       = $fg1
    font_size   = 12
    font_family = $font-text
    position    = 37, 29
    halign      = left
    valign      = bottom
    zindex      = 5
}

# BLUETOOTH
label {
    monitor     =
    text        = cmd[update:1000] echo -e "$($scrPath/bluetooth.sh)"
    color       = $fg1
    font_size   = 12
    font_family = $font-text
    position    = 37, 85
    halign      = left
    valign      = bottom
    zindex      = 5
}

# BATTERY BG
shape {
    monitor       =
    size          = 90, 40
    shadow_passes = $text-shadow-pass
    shadow_boost  = $text-shadow-boost
    color         = $shape-col0
    rounding      = $shape-rd
    position      = -20, 20
    halign        = right
    valign        = bottom
    zindex        = 1
}

# NETWORK BG
shape {
    monitor       =
    size          = 150, 40
    shadow_passes = $text-shadow-pass
    shadow_boost  = $text-shadow-boost
    color         = $shape-col0
    rounding      = $shape-rd
    position      = 20, 20
    halign        = left
    valign        = bottom
    zindex        = 1
}

# BLUETOOTH BG
shape {
    monitor       =
    size          = 150, 40
    shadow_passes = $text-shadow-pass
    shadow_boost  = $text-shadow-boost
    color         = $shape-col0
    rounding      = $shape-rd
    position      = 20, 75
    halign        = left
    valign        = bottom
    zindex        = 1
}
