# =======================================================
# HYPRIDLE CONFIGURATION (Custom Timing)
# =======================================================

general {
    lock_cmd = pidof hyprlock || hyprlock       # Comando para invocar el candado
    before_sleep_cmd = loginctl lock-session    # Bloquear antes de que el sistema entre en reposo
    after_sleep_cmd = hyprctl dispatch dpms on  # Asegurar que el monitor encienda al despertar
    
    # Gestión de periféricos (Drivers de tableta)
    on_lock_cmd = systemctl --user stop opentabletdriver
    on_unlock_cmd = systemctl --user start opentabletdriver
}

# 1. ATENUAR PANTALLA (A los 45 minutos - 2700 segundos)
# Primer aviso visual de que la sesión está por bloquearse.
listener {
    timeout = 2700
    on-timeout = brightnessctl -s set 10%       # Guarda el brillo actual y baja al 10%
    on-resume = brightnessctl -r                # Restaura el brillo guardado (no fuerza 100%)
}

# 2. BLOQUEAR SESIÓN (A 1 hora 20 minutos - 4800 segundos)
# Asegura la sesión con tu hyprlock personalizado.
listener {
    timeout = 4800
    on-timeout = loginctl lock-session
}

# 3. APAGAR MONITOR (A 1 hora 30 minutos - 5400 segundos)
# Ahorro de energía de la pantalla después de haber bloqueado.
listener {
    timeout = 5400
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# NOTA: Sin suspensión automática a propósito — la PC puede quedar trabajando
# (tareas, descargas, escaneos de madrugada) sin entrar en reposo por inactividad.
