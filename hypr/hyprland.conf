# =============================================================================
# HYPRLAND MAIN CONFIGURATION
# User: Efrain (Ckabos)
# System: Arch Linux | Compositor: Hyprland
# =============================================================================

# -----------------------------------------------------------------------------
# 1. MODULARITY (Imports)
# Separation of responsibilities for clean maintenance.
# -----------------------------------------------------------------------------
source= $HOME/.config/hypr/conf/monitors.conf      # Monitor resolution and position configuration
source= $HOME/.config/hypr/conf/environment.conf   # Environment variables (QT, GTK, XDG)
source= $HOME/.config/hypr/conf/workspaces.conf    # Workspace rules and names
source= $HOME/.config/hypr/conf/keybinds.conf      # Keyboard shortcuts (Keybindings)
source= $HOME/.config/hypr/conf/input.conf         # Global keyboard and touchpad configuration
source= $HOME/.config/hypr/conf/windowRules.conf   # Specific rules for windows (Floating, Opacity)
source= $HOME/.config/hypr/conf/theme.conf         # Border colors and visual aesthetics (DYNAMIC COLORS)
source= $HOME/.config/hypr/conf/layerRules.conf    # Layer rules (Blur on panels, notifications)

# -----------------------------------------------------------------------------
# 2. AUTO-START (Session Services)
# -----------------------------------------------------------------------------

# Initialization of the message bus and environment variables for Wayland/Systemd
exec-once=dbus-update-activation-environment --systemd --all
exec-once=systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP

# Aesthetics and auditory feedback on startup
exec-once=$HOME/Varda-Theme/themes/setCursor.sh
# Sonido de inicio de sesión (The Legend of Zelda - BotW). Anterior: desktop-login.oga
# exec-once=play $HOME/.config/hypr/assets/sounds/desktop-login.oga
exec-once=play /home/efrain/OkPanel/ags/sounds/zelda-botw-startup.mp3

# Execute the text monitor
# exec-once = wl-paste --type text --watch cliphist store 

# Execute the image monitor
# exec-once = wl-paste --type image --watch cliphist store

# -----------------------------------------------------------------------------
# 3. STARTUP APPLICATIONS (Via UWSM)
# UWSM manages the life cycle of apps to improve stability.
# -----------------------------------------------------------------------------
exec-once=uwsm app -- $HOME/.config/hypr/scripts/launchers/firefoxHomePageServer.sh
exec-once = systemctl --user start okpanel.service
exec-once=uwsm app -- udiskie -anT                               # Automatic USB drive mounting
exec-once=uwsm app -- syncthing                                 # Cloud file synchronization
exec-once=uwsm app -- polkit-gnome-authentication-agent-1.desktop # Authentication agent (root)
exec-once=uwsm app -- hypridle                                  # Inactivity manager (Autolock)

# -----------------------------------------------------------------------------
# 4. SPECIFIC DEVICE CONFIGURATION
# Hardware sensitivity adjustments.
# -----------------------------------------------------------------------------
device {
    name = logitech-usb-receiver
    sensitivity = -0.3
}

device {
    name = e-signal-usb-gaming-mouse
    sensitivity = -0.8
}

# -----------------------------------------------------------------------------
# 5. GESTURES AND NAVIGATION
# -----------------------------------------------------------------------------
gestures {
    gesture = 3, vertical, workspace # Change workspace with 3 fingers vertically
    workspace_swipe_invert = false
}

general {
    gaps_in = 2                      # Space between windows
    gaps_out = 1              # Space between windows and monitor edge
    
    # Tamaño del borde ajustado para resaltar el motion circular
    border_size = 4
    
    layout = dwindle                 # Organization algorithm (spiral)
    
    # Los colores ahora son manejados dinámicamente por conf/theme.conf
}

cursor {
    warp_on_change_workspace = true  # Moves the cursor to the center when changing workspace
    no_warps = false
}

group {
    groupbar {
        font_family = JetBrainsMonoNerdFontMono-Regular
        font_size = 10
    }
}

# -----------------------------------------------------------------------------
# 6. DECORATION AND AESTHETICS
# -----------------------------------------------------------------------------
decoration {
    rounding = 8
    active_opacity = 1
    inactive_opacity = 1
    
    blur {
        enabled = true
        size = 10
        passes = 5                   # Amount of passes for a smoother blur
        xray = false                 # If true, see through floating windows
    }
    
    shadow {
        enabled = false
    }
}

# -----------------------------------------------------------------------------
# 7. ANIMATIONS
# -----------------------------------------------------------------------------
animations {
    enabled = yes

    # Definition of custom Bezier curves
    bezier = myBezier, 0.05, 0.9, 0.1, 1
    bezier = workspaceBez, 0.61, 1, 0.88, 1
    bezier = linear, 0.0, 0.0, 1.0, 1.0 # Curva lineal para rotación constante

    # Application of animations to elements
    animation = windows, 1, 7, myBezier
    animation = border, 1, 10, default
    
    # VELOCIDAD REDUCIDA A 15: Ahora el bucle gira el doble de rápido
    animation = borderangle, 1, 15, linear, loop 
    
    animation = fade, 1, 7, default
    animation = workspaces, 1, 3, workspaceBez, slidevert # Vertical workspace change
}

# -----------------------------------------------------------------------------
# 8. SYSTEM BEHAVIOR (Misc)
# -----------------------------------------------------------------------------
misc {
    focus_on_activate = true         # Gives focus to apps that request attention (e.g. an opened link)
    disable_hyprland_logo = true     # Clears the background on startup
    disable_hyprland_guiutils_check = true
    enable_anr_dialog = false        # Disables "App not responding" dialog
    on_focus_under_fullscreen = 1    # Keeps fullscreen mode when changing focus
}

# Dwindle layout configuration (Inspired by BSPWM)
dwindle {
    # pseudotile = yes                 # Allows windows with "fake" size (P)
    preserve_split = yes             # Maintains split direction when moving windows
}

# Support for legacy X11 applications
xwayland {
    force_zero_scaling = true        # Avoids blurriness in X11 apps with HiDPI
}

# Hypr ecosystem notification configuration
ecosystem {
    no_update_news = true
    no_donation_nag = true
}
