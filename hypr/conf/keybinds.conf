# See https://wiki.hyprland.org/Configuring/Keywords/ for more
$mainMod = SUPER

# Definir la ruta del panel (Actualizado para usar el binario global en tu $PATH)
$okpanel = okpanel

# ======================
# General
# ======================
bind = $mainMod, Q, killactive,
bind = $mainMod ALT, Q, exit
# Reinicia OkPanel vía systemd (evita instancias huérfanas / bucle de reinicios)
bind = $mainMod ALT, R, exec, systemctl --user restart okpanel.service

# ======================
# Bloqueo de Pantalla
# ======================
bind = CONTROL ALT, Delete, exec, hyprlock

# ======================
# Programas y Aplicaciones
# ======================
# bind = $mainMod, return, exec, uwsm app -- kitty --session fastfetch.session
bind = $mainMod, return, exec, kitty
bind = $mainMod ALT, return, exec, uwsm app -- kitty --session dashboard.session
bind = $mainMod ALT, y, exec, uwsm app -- yazi-kitty.sh
bind = $mainMod ALT, b, exec, uwsm app -- kitty -e btop
bind = $mainMod, E, exec, nautilus
# Reverse Shell Generator de OkPanel (estilo revshells.com)
bind = $mainMod, R, exec, ags request -i OkPanel reverseShells
# Wallpapers de OkPanel (locales + álbum remoto de Google Photos)
bind = $mainMod, W, exec, ags request -i OkPanel wallpapers
# bind = $mainMod, period, exec, ags request -i OkPanel "emojis"
bind = SUPER, period, exec, smile
# bind = $mainMod, T, exec, ~/.config/hypr/scripts/move_window_monitor.sh
bind = $mainMod, T, exec, ~/.config/hypr/scripts/swap_workspace.sh
bind = $mainMod, Print, exec, sh -c 'dest="$HOME/Imágenes/Screenshots/screenshot_$(date +%Y-%m-%d_%H-%M-%S).png"; grim -g "$(slurp)" "$dest" && swappy -f "$dest" && wl-copy < "$dest"'

# ======================
# OkPanel (Menús y Widgets)
# ======================
# Launcher
bind = $mainMod, D, exec, $okpanel launcher
# launcher (Atajo alternativo)
bind = , $mainMod ESCAPE, exec, $okpanel launcher
# Programas
bind = $mainMod, A, exec, $okpanel menu
# Calendario
bind = $mainMod, C, exec, $okpanel calendar
# Portapapeles y Notificaciones
bind = $mainMod, V, exec, $okpanel clipboard
bind = $mainMod, N, exec, $okpanel notification
# No molestar (silencia pop-ups y sonido de notificación).
# Llama directo a la app: el cliente okpanel filtra comandos no listados.
bind = $mainMod SHIFT, N, exec, ags request -i OkPanel dnd
# Screenshots
bind = , print, exec, $okpanel screenshot

# ======================
# Gestión de Ventanas
# ======================
bind = $mainMod SHIFT, space, togglefloating
# bind = $mainMod, M, exec, uwsm stop,
bind = $mainMod, M, cyclenext
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod SHIFT, I, layoutmsg, togglesplit
bind = $mainMod, F, fullscreen, 1
bind = $mainMod SHIFT, F, fullscreen, 0        # Maximizar (Estilo Monocle: Mantiene barras)

# ======================
# 3. Foco y Movimiento (Direccional)
# ======================
# --- FLECHAS ---
bind = $mainMod SHIFT, Left, movewindow, l
bind = $mainMod SHIFT, Right, movewindow, r
bind = $mainMod SHIFT, Up, movewindow, u
bind = $mainMod SHIFT, Down, movewindow, d

# --- VIM KEYS (HJKL) ---
bind = $mainMod SHIFT, H, movewindow, l
bind = $mainMod SHIFT, L, movewindow, r
bind = $mainMod SHIFT, K, movewindow, u
bind = $mainMod SHIFT, J, movewindow, d

# ======================
# 4. Mover Ventanas (Swap)
# ======================
# --- FLECHAS ---
bind = $mainMod, Left, movefocus, l
bind = $mainMod, Right, movefocus, r
bind = $mainMod, Up, movefocus, u
bind = $mainMod, Down, movefocus, d

# --- VIM KEYS (HJKL) ---
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d

# ======================
# 5. Redimensionar (Resize)
# ======================
# Usamos CONTROL para evitar conflictos con menús de apps
bind = $mainMod CONTROL, Left, resizeactive, -50 0
bind = $mainMod CONTROL, Right, resizeactive, 50 0
bind = $mainMod CONTROL, Up, resizeactive, 0 -50
bind = $mainMod CONTROL, Down, resizeactive, 0 50

# Resize con Vim Keys
bind = $mainMod ALT, H, resizeactive, -50 0
bind = $mainMod ALT, L, resizeactive, 50 0
bind = $mainMod ALT, K, resizeactive, 0 -50
bind = $mainMod ALT, J, resizeactive, 0 50

# Ajuste fino (para ventanas flotantes)
bind = $mainMod ALT, Left, moveactive, -50 0
bind = $mainMod ALT, Right, moveactive, 50 0
bind = $mainMod ALT, Up, moveactive, 0 -50
bind = $mainMod ALT, Down, moveactive, 0 50

# ======================
# Workspaces
# ======================
bindp = $mainMod, 1, workspace, 1
bindp = $mainMod, 2, workspace, 2
bindp = $mainMod, 3, workspace, 3
bindp = $mainMod, 4, workspace, 4
bindp = $mainMod, 5, workspace, 5
bindp = $mainMod, 6, workspace, 6
bindp = $mainMod, 7, workspace, 7
bindp = $mainMod, 8, workspace, 8
bindp = $mainMod, 9, workspace, 9
bindp = $mainMod, 0, workspace, 10
bindp = $mainMod, TAB, workspace, previous

# Escape de la VM (SPICE captura el teclado en pantalla completa):
# Ctrl izq + Alt izq salta al workspace anterior aunque la app inhiba atajos (flag p)
bindp = CTRL, Alt_L, workspace, previous

# Mover ventanas a workspaces
bindp = $mainMod SHIFT, 1, movetoworkspace, 1
bindp = $mainMod SHIFT, 2, movetoworkspace, 2
bindp = $mainMod SHIFT, 3, movetoworkspace, 3
bindp = $mainMod SHIFT, 4, movetoworkspace, 4
bindp = $mainMod SHIFT, 5, movetoworkspace, 5
bindp = $mainMod SHIFT, 6, movetoworkspace, 6
bindp = $mainMod SHIFT, 7, movetoworkspace, 7
bindp = $mainMod SHIFT, 8, movetoworkspace, 8
bindp = $mainMod SHIFT, 9, movetoworkspace, 9
bindp = $mainMod SHIFT, 0, movetoworkspace, 10

# # Scroll through workspaces
bind = $mainMod, mouse_down, workspace, r-1
bind = $mainMod, mouse_up, workspace, r+1
# bind = $mainMod, kp_down, workspace, r+1
# bind = $mainMod, kp_up, workspace, r-1
# bind = $mainMod, down, workspace, r+1
# bind = $mainMod, up, workspace, r-1
# bind = $mainMod, next, workspace, r+1
# bind = $mainMod, prior, workspace, r-1
# bind = , next, workspace, r+1
# bind = , prior, workspace, r-1
# bind = $mainMod, j, workspace, r+1
# bind = $mainMod, k, workspace, r-1

# ======================
# Grupos y Mouse (Interacción)
# ======================
# Groups
# bind = $mainMod, g, togglegroup
# bind = $mainMod, Tab, changegroupactive
# bind = $mainMod, l, lockactivegroup, toggle

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
bindm = $mainMod ALT, mouse:272, resizewindow

# ======================
# Volume and Media / Brightness
# ======================
# Se ha actualizado 'bindl' a 'bindel' en el volumen para permitir mantener presionada la tecla
bindel = , XF86AudioRaiseVolume, exec, $okpanel volume-up
bindel = , XF86AudioLowerVolume, exec, $okpanel volume-down
bindl = , XF86AudioMute, exec, $okpanel mute
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous

# Brightness
bindl = , XF86MonBrightnessUp, exec, $HOME/.config/hypr/scripts/brightness/changeBrightness.sh increase
bindl = , XF86MonBrightnessDown, exec, $HOME/.config/hypr/scripts/brightness/changeBrightness.sh decrease

# Tecla de calculadora: abre el launcher de OkPanel directo en modo "=" (cálculo).
# Si tu tecla no dispara, ejecuta `wev` y cambia XF86Calculator por el keysym real.
bind = , XF86Calculator, exec, ags request -i OkPanel calc
